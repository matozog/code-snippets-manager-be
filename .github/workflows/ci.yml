name: CI

on:
  push:
    branches: [master, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # tests start Postgres with Testcontainers, Docker is available on GitHub-hosted runners
      - name: Build and test
        run: |
          chmod +x mvnw
          ./mvnw -B verify

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t code-snippets-manager-be .

# Render provides the port to listen on in the PORT variable
server.port=${PORT:8090}

# Production database (Neon) comes from environment variables, e.g.
# DB_URL=jdbc:postgresql://<host>/<database>?sslmode=require
# Locally the dev profile starts Postgres from compose.yaml instead.
spring.datasource.url=${DB_URL:}
spring.datasource.username=${DB_USER:}
spring.datasource.password=${DB_PASSWORD:}
# Neon free tier allows a limited number of connections and suspends idle compute
spring.datasource.hikari.maximum-pool-size=5

# Schema is owned by Flyway migrations (src/main/resources/db/migration); Hibernate only validates it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# Safe production defaults: developer tools are enabled only by the "dev" profile.
spring.docker.compose.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

app.cors.allowed-origins=https://matozog.github.io

# OAuth client id from Google Cloud Console ("Sign in with Google"); only ID tokens issued for it are accepted.
# Set with the GOOGLE_CLIENT_ID environment variable; the application does not start without it.
app.auth.google-client-id=${GOOGLE_CLIENT_ID:}
